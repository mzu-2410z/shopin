<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | ShopSphere</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN & Feather Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Instrument Serif"', 'Georgia', 'serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                    colors: {
                        ink: {
                            50: '#fbfbf9',
                            100: '#f5f5f2',
                            200: '#e8e8e2',
                            300: '#d5d5cc',
                            400: '#a8a89a',
                            500: '#7c7c6e',
                            600: '#58584d',
                            700: '#3f3f37',
                            800: '#262621',
                            900: '#171714',
                            950: '#0d0d0b',
                        },
                        accent: {
                            500: '#c2410c',
                            600: '#9a3412',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-serif-italic {
            font-family: 'Instrument Serif', Georgia, serif;
            font-style: italic;
        }
    </style>
</head>
<body class="bg-ink-50 dark:bg-ink-950 text-ink-900 dark:text-ink-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-stone-200 dark:selection:bg-stone-800 transition-colors duration-300 relative">

    <!-- Ambient Subtle Dot Pattern -->
    <div class="absolute inset-0 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] dark:bg-[radial-gradient(#262626_1px,transparent_1px)] [background-size:24px_24px] pointer-events-none opacity-40"></div>

    <!-- Top Float Navigation -->
    <header class="w-full relative z-10 py-6 px-6 sm:px-10 flex items-center justify-between">
        <a href="/" class="group inline-flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-full bg-ink-900 dark:bg-ink-100 text-ink-50 dark:text-ink-900 flex items-center justify-center transition-transform group-hover:scale-105 duration-300">
                <i data-feather="shopping-bag" class="w-4 h-4"></i>
            </span>
            <span class="text-sm font-semibold tracking-tight uppercase text-ink-950 dark:text-ink-50 font-mono">
                ShopSphere
            </span>
        </a>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="w-9 h-9 rounded-full border border-ink-200 dark:border-ink-800 flex items-center justify-center text-ink-600 dark:text-ink-400 hover:bg-ink-100 dark:hover:bg-ink-900 hover:text-ink-950 dark:hover:text-ink-100 transition-all" aria-label="Toggle Theme">
            <i data-feather="moon" class="w-4 h-4 hidden dark:block"></i>
            <i data-feather="sun" class="w-4 h-4 dark:hidden"></i>
        </button>
    </header>

    <!-- Main Password Recovery Card -->
    <main class="relative z-10 flex-grow flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full">

            <!-- Card Shell -->
            <div class="bg-white/80 dark:bg-ink-900/70 backdrop-blur-xl border border-ink-200/80 dark:border-ink-800/80 rounded-3xl p-8 sm:p-10 shadow-xl shadow-ink-950/5">

                <!-- Badge & Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-ink-100 dark:bg-ink-800/60 border border-ink-200 dark:border-ink-700/60 mb-3">
                        <span class="w-1.5 h-1.5 rounded-full bg-accent-500"></span>
                        <span class="text-[10px] font-mono uppercase tracking-[0.2em] text-ink-600 dark:text-ink-400">Credential Recovery</span>
                    </div>

                    <h1 class="text-2xl sm:text-3xl font-serif text-ink-950 dark:text-ink-50 font-normal">
                        Reset your password <span class="font-serif-italic text-ink-400 dark:text-ink-500 block text-xl sm:text-2xl mt-0.5">— Key Dispatch</span>
                    </h1>

                    <p class="mt-2 text-xs text-ink-500 dark:text-ink-400 leading-relaxed max-w-xs mx-auto font-normal">
                        Enter the email associated with your account to receive instructions for resetting your password.
                    </p>
                </div>

                <!-- Form -->
                <form class="space-y-6" action="#" method="POST">

                    <div>
                        <label for="email" class="block text-[11px] font-mono uppercase tracking-wider text-ink-600 dark:text-ink-400 mb-2">
                            Email address
                        </label>
                        <div class="relative">
                            <input id="email"
                                   name="email"
                                   type="email"
                                   autocomplete="email"
                                   required
                                   class="w-full px-4 py-3 bg-ink-50/50 dark:bg-ink-950/50 border border-ink-200 dark:border-ink-800 rounded-xl text-xs sm:text-sm text-ink-900 dark:text-ink-100 placeholder-ink-400 focus:outline-none focus:border-ink-900 dark:focus:border-ink-100 transition-colors font-sans"
                                   placeholder="you@example.com">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button type="submit"
                                class="group w-full inline-flex items-center justify-center gap-2 py-3.5 px-6 rounded-xl bg-ink-900 hover:bg-ink-800 dark:bg-ink-100 dark:hover:bg-ink-200 text-ink-50 dark:text-ink-900 text-xs font-medium uppercase tracking-[0.15em] transition-all duration-300 shadow-sm">
                            <span>Send Reset Link</span>
                            <i data-feather="arrow-right" class="w-3.5 h-3.5 transition-transform group-hover:translate-x-1"></i>
                        </button>
                    </div>

                </form>

                <!-- Back to Sign In Link -->
                <div class="mt-8 pt-6 border-t border-ink-200/80 dark:border-ink-800/80 text-center">
                    <a href="{% url 'accounts:login' %}"
                       class="inline-flex items-center gap-2 text-xs font-mono uppercase tracking-wider text-ink-500 hover:text-ink-950 dark:text-ink-400 dark:hover:text-ink-100 transition-colors group">
                        <i data-feather="arrow-left" class="w-3.5 h-3.5 transition-transform group-hover:-translate-x-1"></i>
                        <span>Back to Sign In</span>
                    </a>
                </div>

            </div>

            <!-- Context Hint -->
            <div class="mt-6 text-center">
                <p class="text-[11px] font-mono text-ink-400 dark:text-ink-500">
                    Need further concierge assistance? Contact <a href="#" class="underline hover:text-ink-700 dark:hover:text-ink-300">support</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Micro Footer -->
    <footer class="relative z-10 py-6 text-center border-t border-ink-200/50 dark:border-ink-800/50">
        <p class="text-[11px] font-mono text-ink-400 dark:text-ink-500">
            &copy; {% now "Y" %} ShopSphere. Encrypted Access System.
        </p>
    </footer>

    <!-- Scripts -->
    <script>
        // Initialize Feather Icons
        feather.replace();

        // Theme toggle handling
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</body>
</html>
